<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Segoe UI', 'Inter', 'DM Sans', Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="560" fill="#F5F8FC"/>

  <!-- Title label -->
  <text x="450" y="38" text-anchor="middle" font-size="13" fill="#8A8A8A" letter-spacing="2" font-weight="600">PDS CONNECT · LOGO VARIANTS</text>
  <line x1="40" y1="52" x2="860" y2="52" stroke="#D8E6F5" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VARIANT 1 · PRIMARY (Icon + Text) · Light  -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="40" y="68" width="400" height="180" rx="16" fill="#FFFFFF" stroke="#D8E6F5" stroke-width="1"/>
  <text x="60" y="96" font-size="11" fill="#8A8A8A" letter-spacing="1.5" font-weight="600">PRIMARY · LIGHT BACKGROUND</text>

  <!-- Icon: two nodes + arc -->
  <g transform="translate(68, 115)">
    <!-- Arc connecting nodes -->
    <path d="M 10 20 Q 26 4 42 20" stroke="#5BABF0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Left node -->
    <circle cx="10" cy="20" r="5.5" fill="#2E7FD9"/>
    <!-- Right node -->
    <circle cx="42" cy="20" r="5.5" fill="#2E7FD9"/>
    <!-- Center dot (connection point) -->
    <circle cx="26" cy="9" r="3.2" fill="#5BABF0"/>
  </g>

  <!-- Wordmark -->
  <text x="126" y="142" font-size="32" font-weight="800" fill="#2E7FD9" letter-spacing="-0.5">PDS</text>
  <text x="197" y="142" font-size="32" font-weight="400" fill="#0D0D0D" letter-spacing="-0.3">Connect</text>

  <!-- Tagline -->
  <text x="126" y="162" font-size="11.5" fill="#8A8A8A" letter-spacing="1.8" font-weight="500">BUSINESS MATCHING PLATFORM</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VARIANT 2 · PRIMARY · Dark Background      -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="460" y="68" width="400" height="180" rx="16" fill="#0D0D0D"/>
  <text x="480" y="96" font-size="11" fill="#8A8A8A" letter-spacing="1.5" font-weight="600">PRIMARY · DARK BACKGROUND</text>

  <!-- Icon: two nodes + arc -->
  <g transform="translate(488, 115)">
    <path d="M 10 20 Q 26 4 42 20" stroke="#5BABF0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="10" cy="20" r="5.5" fill="#5BABF0"/>
    <circle cx="42" cy="20" r="5.5" fill="#5BABF0"/>
    <circle cx="26" cy="9" r="3.2" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="546" y="142" font-size="32" font-weight="800" fill="#5BABF0" letter-spacing="-0.5">PDS</text>
  <text x="617" y="142" font-size="32" font-weight="400" fill="#FFFFFF" letter-spacing="-0.3">Connect</text>

  <!-- Tagline -->
  <text x="546" y="162" font-size="11.5" fill="#8A8A8A" letter-spacing="1.8" font-weight="500">BUSINESS MATCHING PLATFORM</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VARIANT 3 · COMPACT · No tagline           -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="40" y="268" width="260" height="120" rx="16" fill="#FFFFFF" stroke="#D8E6F5" stroke-width="1"/>
  <text x="60" y="296" font-size="11" fill="#8A8A8A" letter-spacing="1.5" font-weight="600">COMPACT · NAVBAR USE</text>

  <g transform="translate(56, 308)">
    <path d="M 8 16 Q 20 4 32 16" stroke="#5BABF0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="16" r="4.5" fill="#2E7FD9"/>
    <circle cx="32" cy="16" r="4.5" fill="#2E7FD9"/>
    <circle cx="20" cy="6" r="2.8" fill="#5BABF0"/>
  </g>

  <text x="98" y="328" font-size="24" font-weight="800" fill="#2E7FD9" letter-spacing="-0.5">PDS</text>
  <text x="152" y="328" font-size="24" font-weight="400" fill="#0D0D0D" letter-spacing="-0.3">Connect</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VARIANT 4 · ICON ONLY (favicon / avatar)   -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="320" y="268" width="120" height="120" rx="16" fill="#FFFFFF" stroke="#D8E6F5" stroke-width="1"/>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#8A8A8A" letter-spacing="1.5" font-weight="600">ICON</text>

  <!-- Icon only, larger -->
  <g transform="translate(344, 306)">
    <path d="M 14 28 Q 36 6 58 28" stroke="#5BABF0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="14" cy="28" r="8" fill="#2E7FD9"/>
    <circle cx="58" cy="28" r="8" fill="#2E7FD9"/>
    <circle cx="36" cy="10" r="5" fill="#5BABF0"/>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VARIANT 5 · BLUE BACKGROUND                -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="460" y="268" width="400" height="120" rx="16" fill="#2E7FD9"/>
  <text x="480" y="296" font-size="11" fill="rgba(255,255,255,0.55)" letter-spacing="1.5" font-weight="600">PRIMARY BLUE BACKGROUND</text>

  <g transform="translate(476, 308)">
    <path d="M 8 16 Q 20 4 32 16" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="16" r="4.5" fill="#FFFFFF"/>
    <circle cx="32" cy="16" r="4.5" fill="#FFFFFF"/>
    <circle cx="20" cy="6" r="2.8" fill="rgba(255,255,255,0.85)"/>
  </g>

  <text x="518" y="328" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">PDS</text>
  <text x="572" y="328" font-size="24" font-weight="400" fill="rgba(255,255,255,0.88)" letter-spacing="-0.3">Connect</text>
  <text x="518" y="348" font-size="10.5" fill="rgba(255,255,255,0.55)" letter-spacing="1.8" font-weight="500">BUSINESS MATCHING PLATFORM</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SPACING RULES NOTE                         -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="40" y1="408" x2="860" y2="408" stroke="#D8E6F5" stroke-width="1"/>
  <text x="450" y="432" text-anchor="middle" font-size="12" fill="#3A3A3A" font-weight="600">CLEAR SPACE RULE</text>
  <text x="450" y="452" text-anchor="middle" font-size="11.5" fill="#8A8A8A">Minimum clear space = height of the "P" character on all sides</text>
  <text x="450" y="470" text-anchor="middle" font-size="11.5" fill="#8A8A8A">Minimum width: 120px (compact) · 180px (full with tagline)</text>

  <!-- Icon anatomy label -->
  <text x="450" y="498" text-anchor="middle" font-size="11.5" fill="#8A8A8A">Icon symbolises: two business nodes (left + right) connected through a shared touchpoint (center dot)</text>
  <text x="450" y="516" text-anchor="middle" font-size="11.5" fill="#8A8A8A">representing PDS Connect's core function — bridging the right partners.</text>

  <!-- Footer -->
  <text x="450" y="545" text-anchor="middle" font-size="11" fill="#D8E6F5" letter-spacing="1">PDS CONNECT · BRAND IDENTITY · v1.0 · 2026</text>

</svg>
